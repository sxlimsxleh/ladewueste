# Publishes the static demo to GitHub Pages: https://<owner>.github.io/<repo>/
# It downloads the real register, runs the full pipeline (dbt tests included), exports the API
# answers the demo needs as JSON (api/export_demo.py) and builds the web app in demo mode.
# Runs on every push to main and weekly, so the public demo follows new register releases.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Demo site (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 5 * * 1"   # Mondays 05:47 UTC, after the weekly real-register check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --frozen
      - name: Download + full pipeline (raw data stays on the runner)
        run: uv run python -m pipeline.run_all
      - name: Export the demo's API answers as JSON
        run: uv run python -m api.export_demo web/public/demo-data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app in static demo mode
        working-directory: web
        env:
          VITE_DEMO: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
