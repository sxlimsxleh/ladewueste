# Weekly: download the real Ladesäulenregister and run the full pipeline. If the Bundesnetzagentur
# changes the file layout, the bronze loader or a dbt test fails here first, and GitHub emails the
# repository owner. The raw file is never stored; only the derived reports are kept as artifacts.
name: Real register (weekly)

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --frozen
      - name: Download + bronze + profile + dbt build + gold + report
        run: uv run python -m pipeline.run_all
      - name: Keep the reports (not the raw data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          retention-days: 30
          if-no-files-found: warn
          path: |
            docs/mess_report.md
            docs/operator_merge_review.csv
            data/gold/quality_report.json
