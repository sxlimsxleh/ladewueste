# Same URLs as the Vite dev server: the page calls /api/..., nginx forwards it to the api container.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000/;   # trailing slash strips the /api prefix
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }

    # Hashed assets never change; index.html must always be fresh.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
