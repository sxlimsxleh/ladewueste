[project]
name = "ladewueste"
version = "0.1.0"
description = "Where Germany runs out of fast chargers: cleaning the BNetzA Ladesäulenregister"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
