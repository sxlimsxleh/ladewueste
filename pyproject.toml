[project]
name = "ladewueste"
version = "0.1.0"
description = "Where Germany runs out of fast chargers: cleaning the BNetzA Ladesäulenregister"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "dbt-duckdb>=1.11.1",
    "rapidfuzz>=3.14.6",
    "pandas>=3.1.1",
    "h3>=4",
    "fastapi>=0.162.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "api/tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]
