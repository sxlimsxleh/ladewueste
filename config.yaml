# Ladewüste configuration. Every tunable number lives here, not in code.

source:
  # Official download page of the Ladesäulenregister (licence: CC BY 4.0,
  # attribution "Bundesnetzagentur.de" as required on that page).
  landing_page: "https://www.bundesnetzagentur.de/DE/Fachthemen/ElektrizitaetundGas/E-Mobilitaet/Ladesaeulenkarte/start.html"
  # The CSV file name carries its publication date, so we discover it from the page.
  csv_link_pattern: 'https://data\.bundesnetzagentur\.de/[^"]*Ladesaeulenregister[^"]*\.csv'
  attribution: "Bundesnetzagentur.de"
  licence: "CC BY 4.0"
  licence_url: "https://creativecommons.org/licenses/by/4.0/"

boundary:
  # Natural Earth admin-0 countries, 1:10m, pinned release. Public domain.
  url: "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_0_countries.geojson"
  iso_a3: "DEU"

coverage:
  hpc_threshold_kw: 150        # a charging point is HPC if power_kw >= this
  desert_radius_km: 25         # a cell is desert if nearest HPC is farther than this
  h3_resolutions:
    map: 6
    detail: 7

cleaning:
  max_plausible_point_kw: 1500 # above this a single charging point is flagged as implausible
  duplicate_radius_m: 20       # same operator within this distance -> duplicate candidate
  border_tolerance_km: 2       # outside the 1:10m polygon but this close to the border = likely generalisation, not an error
  placeholder_min_towns: 4     # one coordinate used by stations in this many different towns = placeholder
  low_precision_decimals: 2    # lat or lon with this many decimals or fewer (~1 km) is low precision
